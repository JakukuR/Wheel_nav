<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R680 导航网关</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">WLA</span><div><b>R680 导航网关</b><small id="clock">等待 ROS 数据</small></div></div>
    <div class="health">
      <span id="mapChip" class="chip">地图</span>
      <span id="tfChip" class="chip">定位</span>
      <span id="odomChip" class="chip">里程计</span>
      <span id="goalChip" class="chip accent">空闲</span>
    </div>
  </header>
  <main>
    <section class="map-panel panel">
      <div class="panel-title"><div><b>二维导航视图</b><small id="mapInfo">等待 OccupancyGrid</small><small id="semanticInfo">语义地图：等待数据</small></div><div class="coordinates" id="cursorPos">x —　y —</div></div>
      <div id="mapWrap" class="map-wrap">
        <canvas id="mapCanvas"></canvas>
        <div class="map-hint">滚轮缩放 · 右键拖动画布 · 左键拖拽设置位置与方向</div>
        <div id="toast" class="toast"></div>
      </div>
      <div class="legend">
        <span><i class="robot"></i>车体</span><span><i class="global"></i>全局路径</span>
        <span><i class="local"></i>局部路径</span><span><i class="near"></i>即时障碍</span>
        <span><i class="confirmed"></i>确认障碍</span><span><i class="home"></i>出生点</span><span><i class="furniture-confirmed"></i>已确认家具</span>
      </div>
    </section>
    <aside>
      <section class="panel velocity-panel">
        <div class="panel-title"><div><b>速度指令曲线</b><small>最近 30 秒 · 平滑前与平滑后</small></div></div>
        <div class="velocity-switch"><button id="linearVelocity" class="active">线速度 m/s</button><button id="angularVelocity">角速度 rad/s</button></div>
        <div class="velocity-legend"><span><i class="velocity-raw"></i>/cmd_vel_nav</span><span><i class="velocity-smooth"></i>/cmd_vel_smoothed</span></div>
        <div class="velocity-plot"><canvas id="velocityCanvas" aria-label="速度指令曲线"></canvas></div>
        <div class="velocity-values"><span id="rawVelocity">原始：等待数据</span><span id="smoothVelocity">平滑：等待数据</span></div>
      </section>
      <section class="panel controls">
        <div class="panel-title"><div><b>导航控制</b><small>在地图上拖出朝向</small></div></div>
        <div class="mode-row">
          <button id="goalMode" class="primary active">设置导航目标</button>
          <button id="poseMode">设置初始位姿</button>
        </div>
        <div class="button-row"><button id="fitMap">适配地图</button><button id="cancelGoal" class="danger">取消导航</button></div>
        <button id="returnHome" class="wide home-action" disabled>返回出生点</button>
        <button id="clearMaps" class="wide">清理局部与全局代价地图</button>
        <div class="metrics">
          <div><span>线速度</span><strong id="vx">—</strong><small>m/s</small></div>
          <div><span>角速度</span><strong id="wz">—</strong><small>rad/s</small></div>
          <div><span>机器人位姿</span><strong id="pose">—</strong><small>map</small></div>
          <div><span>目标状态</span><strong id="goalStatus">idle</strong><small>NavigateToPose</small></div>
        </div>
        <div class="layers">
          <label><input type="checkbox" data-layer="global_path" checked>全局路径</label>
          <label><input type="checkbox" data-layer="local_path" checked>局部路径</label>
          <label><input type="checkbox" data-layer="near_obstacles" checked>即时障碍</label>
          <label><input type="checkbox" data-layer="confirmed_obstacles" checked>确认障碍</label>
          <label><input type="checkbox" data-layer="home" checked>出生点</label>
          <label><input type="checkbox" data-layer="semantic_furniture" checked>家具语义</label>
        </div>
      </section>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
