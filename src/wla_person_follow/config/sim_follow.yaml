person_follow:
  ros__parameters:
    # Only the compatibility and first_batch_v2 presets are accepted by the node.
    follow_preset: first_batch_v2
    enable_motion: false
    output_mode: mux
    direct_topic: /r680_base/cmd_vel
    relative_topic: /r680/perception/relative_objects
    detection_status_topic: /r680/nav/perception/status
    depth_topic: /r680/d455/aligned_depth_to_color/image_raw
    camera_info_topic: /r680/d455/color/camera_info
    wheel_topic: /wheel/odom
    base_frame: r680_mapping_floor
    depth_stride: 4
    depth_min_m: 0.15
    depth_max_m: 5.0
    surface_to_center_offset_m: 0.28
    max_sensor_age_s: 0.30
    result_ttl_s: 0.15
    tof_enabled: false
    local_assumed_free_radius_m: 0.5
    startup_clear_radius_m: 0.0
    startup_motion_threshold_m: 0.03
    target_mask_enabled: true
    reid_enabled: true
    reid_model_id: "boxmot25-osnet-x025-msmt17:cf55163d78fc44c6"
    reid_max_lost_s: 8.0
    reid_similarity: 0.80
    reid_margin: 0.08
    reid_confirm_frames: 3

    geometry_binding_v2: true
    identity_supervisor_v2: true
    lost_task_release: true
    mask_binding_v2: true
    reverse_policy_v2: true
    diagnostic_v2: true
    front_check_truncation_enabled: true

    # New defaults are provisional (待校准), configurable, and logged.
    front_check_max_m: 1.4
    front_check_target_offset_m: 0.87
    binding_missing_grace_s: 0.20
    binding_jump_radius_m: 0.45
    binding_jump_growth_mps: 0.25
    binding_jump_radius_max_m: 1.50
    enrollment_speed_cap_enabled: false
    enrollment_speed_cap_mps: 0.30
    enrollment_timeout_s: 10.0
    supervision_window: 10
    suspect_negative_frames: 6
    suspect_recovery_frames: 6
    suspect_timeout_s: 12.0
    neighbor_ambiguity_radius_m: 1.50
    neighbor_clear_hold_s: 0.50
    active_search_s: 8.0
    target_release_s: 30.0
    view_expansion_geometry_hold_s: 2.0 # 待校准
    view_expansion_clear_hold_s: 2.0 # 待校准
    view_expansion_similarity: 0.75
    view_expansion_neighbor_radius_m: 1.50
    view_expansion_min_interval_s: 1.0
    view_expansion_initial_slots: 2
    reverse_policy_allow_retreat: false
    retreat_disabled: false
