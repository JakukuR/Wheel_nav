person_follow:
  ros__parameters:
    # Geometry owns follow/search; appearance is a recovery-only sidecar.
    follow_preset: tracker_follow
    enable_motion: false
    # mpc, or neupan for mode 0 (needs neupan_bridge/build.sh). Launch: local_planner:=neupan
    local_planner: mpc
    # cylinder (mask/box + tracked-position cylinder), or cluster: connectivity in the
    # raw cloud seeded by the tracker. Launch: person_filter:=cluster
    target_person_filter: cylinder
    # Drop depth patches below this many pixels before the cloud is built; 0 is off.
    # Launch: depth_speckle:=150
    depth_speckle_max_px: 0
    depth_speckle_diff_m: 0.075
    # Search behind grid detours. Launch: grid_route:=astar
    grid_route_planner: dijkstra
    output_mode: mux
    direct_topic: /r680_base/cmd_vel
    relative_topic: /r680/perception/relative_objects
    detection_status_topic: /r680_nav/perception/status
    depth_topic: /r680/d455/aligned_depth_to_color/image_raw
    camera_info_topic: /r680/d455/color/camera_info
    # 50 Hz window mean from the chassis driver; the 200 Hz topic costs rclpy ~30% CPU.
    wheel_topic: /wheel/odom_50hz
    base_frame: r680_mapping_floor
    depth_stride: 4
    depth_min_m: 0.15
    depth_max_m: 5.0
    surface_to_center_offset_m: 0.28
    # Target observation age a result may use. 0.30 zeroed 43-65 % of commands at
    # J02 2026-10-30 14:50/15:02: observation -> result was 236-259 ms (p90 293-315)
    # under load, so results arrived nearly expired (replay: 0.40 -> about 19 %).
    max_sensor_age_s: 0.40
    # Depth frame age a control-rate replan may still plan on.
    map_max_age_s: 0.45
    # wla_terrain_analysis obstacle cloud (follow.launch.py terrain:=true sets it); empty = off.
    terrain_topic: ""
    result_ttl_s: 0.20
    # A result keeps driving the base until a newer one arrives, at most this long
    # (map age is still capped by map_max_age_s). 0.20 zeroed 10-20 % of commands
    # while following and 53 % while detouring (J02 2026-10-29 17:47).
    result_hold_s: 0.35
    tof_enabled: false
    local_assumed_free_radius_m: 0.5
    startup_clear_radius_m: 0.0
    startup_motion_threshold_m: 0.03
    target_mask_enabled: true
    reid_enabled: true
    reid_model_id: "boxmot25-osnet-x025-msmt17:cf55163d78fc44c6"
    # Recovery since 2026-11-02: while lost, every visible person (nearest four)
    # is compared; the best match is re-acquired with no position gate if it is
    # >= reid_search_similarity and leads the next by reid_margin, after
    # reid_confirm_frames matches each within 2 s (bad frames do not reset).
    # With only one person in view the bar is reid_alone_similarity instead.
    # reid_similarity, reid_search_radius_m and reid_search_confirm_frames are
    # kept for validation/status only and no longer used by recovery.
    reid_similarity: 0.40
    reid_margin: 0.08
    reid_confirm_frames: 3
    reid_search_radius_m: 4.0
    reid_search_similarity: 0.55
    reid_alone_similarity: 0.45
    reid_search_confirm_frames: 5
    target_prediction_s: 2.0
    # Sparse accepted observations; freeze on loss for last-seen search.
    target_history_window_s: 5.0
    target_history_sample_period_s: 0.4
    search_arrival_m: 0.35
    binding_jump_radius_m: 0.45
    binding_jump_growth_mps: 0.25
    binding_jump_radius_max_m: 1.50
    neighbor_ambiguity_radius_m: 1.50
    target_ghost_clear_enabled: true
    target_bbox_filter_enabled: true
    target_ghost_clear_radius_m: 0.35
    target_ghost_clear_ttl_s: 0.50
    # Forget map hits that appeared where the followed person stood (lagging
    # box / short detection gaps); cells become unknown, not free.
    target_trail_clear_enabled: true
    target_trail_clear_radius_m: 0.30
