person_follow:
  ros__parameters:
    enable_motion: false
    output_mode: mux
    direct_topic: /r680_base/cmd_vel
    relative_topic: /r680/perception/relative_objects
    detection_status_topic: /r680_nav/perception/status
    depth_topic: /r680/d455/aligned_depth_to_color/image_raw
    camera_info_topic: /r680/d455/color/camera_info
    wheel_topic: /wheel/odom
    base_frame: r680_mapping_floor
    depth_stride: 4
    # Native follower depth range matches the local display filter policy.
    depth_min_m: 0.15
    depth_max_m: 5.0
    surface_to_center_offset_m: 0.28
    max_sensor_age_s: 0.30
    result_ttl_s: 0.15
    tof_enabled: false
    # Explicit user-requested starting assumption, not measured free space.
    # Continuous robot-centered assumption, including idle; sensor obstacles win.
    local_assumed_free_radius_m: 0.5
    startup_clear_radius_m: 0.0
    startup_motion_threshold_m: 0.03
    # Target-only ReID; descriptors come from a separate read-only CPU sidecar.
    reid_enabled: true
    reid_model_id: "osnet-x025-msmt17:cf55163d78fc44c6"
    reid_max_lost_s: 8.0
    reid_similarity: 0.80
    reid_margin: 0.08
    reid_confirm_frames: 3
