person_follow:
  ros__parameters:
    relative_topic: /r680/perception/relative_objects
    detection_status_topic: /r680_nav/perception/status
    depth_topic: /r680/d455/aligned_depth_to_color/image_raw
    camera_info_topic: /r680/d455/color/camera_info
    base_frame: r680_mapping_floor
    max_sensor_age_s: 0.30
    follow_distance_m: 1.40
    approach_distance_m: 0.95
    max_linear_mps: 0.20
    max_angular_rps: 0.45
    emergency_distance_m: 0.60
    obstacle_height_min_m: 0.10
    obstacle_height_max_m: 1.50
    obstacle_inflation_m: 0.45
    depth_min_m: 0.25
    depth_max_m: 5.0
    camera_min_valid_fraction: 0.25
    camera_front_min_valid_fraction: 0.35
    enable_motion: false
