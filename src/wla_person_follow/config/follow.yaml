    rgb_topic: /r680/d455/color/image_raw
    depth_topic: /r680/d455/aligned_depth_to_color/image_raw
    camera_info_topic: /r680/d455/color/camera_info
    odom_topic: /wheel/odom
    base_frame: r680_mapping_floor
