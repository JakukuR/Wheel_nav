:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#101720;color:#e7edf4}body{margin:0;padding:20px;max-width:1600px;margin:auto}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;margin:0}a{color:#8fcdff}#link{margin-left:auto;color:#ffc880}.note{color:#b2c1d1}main{display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#1a2633;border:1px solid #35475a;border-radius:10px;overflow:hidden}.card.rgb{width:100%}.heading{padding:10px 14px;display:flex;align-items:center;gap:12px}.heading b{flex:1}button{background:#2c4057;color:white;border:1px solid #5a7694;border-radius:6px;padding:6px 12px;cursor:pointer}.view{position:relative;aspect-ratio:16/9;background:#060b11;display:grid;place-items:center}#left .view,#rgb .view{aspect-ratio:16/9}.view img{width:100%;height:100%;object-fit:contain;display:block}.view img:not([src]){visibility:hidden}.guide{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(50% - .5px),#ffda7566 50%,transparent calc(50% + .5px)),linear-gradient(0deg,transparent calc(50% - .5px),#ffda7566 50%,transparent calc(50% + .5px));border:1px solid #ffda7544;box-sizing:border-box}.guide:after{content:'';position:absolute;inset:10%;border:1px dashed #ffda7577}.no-guides .guide{display:none}.empty{position:absolute;background:#101720dc;padding:8px 16px;border-radius:6px;color:#ffc880}.meta{margin:0;padding:8px 14px;font-variant-numeric:tabular-nums;color:#b2c1d1}.topic{padding:0 14px 10px;overflow-wrap:anywhere;color:#9bb1c8;font-size:12px}.card:fullscreen{max-width:none;background:#101720;display:flex;flex-direction:column}.card:fullscreen .view{flex:1;min-height:0;aspect-ratio:auto}.card:fullscreen img{position:absolute;inset:0}.card:fullscreen .guide{display:none}code{color:#a3d6ff}footer{margin-top:20px;color:#b2c1d1}@media(max-width:850px){body{padding:10px}main{grid-template-columns:1fr}.card.rgb{grid-column:auto}}
