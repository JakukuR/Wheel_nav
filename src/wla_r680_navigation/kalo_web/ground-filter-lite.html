<style>body{margin:0;background:#101720;color:#dce9f6;font:14px system-ui}header{padding:14px;display:flex;gap:16px;align-items:center}h1{font-size:18px;margin:0}a{color:#91caff}#link{margin-left:auto}.status{padding:6px 16px;color:#b4c8d8}.panel{margin:12px;border:1px solid #334453;border-radius:8px;overflow:hidden}.bar{display:flex;align-items:center;gap:20px;padding:10px;background:#1b2936}button{background:#283e50;color:white;border:1px solid #526777;padding:6px;cursor:pointer}.view{position:relative}canvas{display:block;width:100%;max-height:460px;object-fit:contain;background:#0b1018;touch-action:none}.empty{position:absolute;inset:40% 0;text-align:center;color:#edb54a}.note{padding:10px 16px;color:#a7bdcf;line-height:1.6}label{cursor:pointer}</style>
<header><h1>拟合地面 → 高度滤除 → 点云</h1><a href="/">主调试页</a><span id="link">正在连接</span></header><div id="metrics" class="status">等待点云</div><div id="plane" class="status"></div>
<section class="panel"><div class="bar"><span>滤后点云 · 红色凸起／黄色低矮或不确定／紫色低于平面</span><label><input type="checkbox" id="showGround">叠加被滤除的地面（绿色）</label><button id="reset">复位视角</button></div><div class="view"><canvas id="surface" width="700" height="420" aria-label="按拟合平面高度滤除后的点云"></canvas><div class="empty" id="surfaceEmpty">等待点云</div></div></section>
<div class="note">滤除拟合面上下 1.5 cm 内的点，其余点保留；不设置上方高度截断。拖动旋转、滚轮缩放。网格线仅为视角参考，没有占据栅格或地图融合。显示以拟合面展开，ROS 点云保持原相机坐标与采集时间戳。平面或输入失效时清空点云；当前仅测试，未接运动控制。</div><script src="ground-filter-lite.js"></script></html>
