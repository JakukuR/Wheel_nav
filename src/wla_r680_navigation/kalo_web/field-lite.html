<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当前帧距离场 · Kalo</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#101720;color:#e7edf4}body{margin:0;padding:12px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}a{color:#8fcdff}.badge{color:#ffd18b;background:#3b3020;padding:3px 9px;border-radius:5px}#link{margin-left:auto}#metrics{color:#b2c1d1;min-height:22px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#1a2633;border:1px solid #35475a;border-radius:9px;overflow:hidden}.heading{padding:10px 14px;display:flex;align-items:center;gap:10px}.heading b{flex:1}.view{position:relative}canvas{width:100%;height:360px;display:block;touch-action:none}.empty{position:absolute;inset:0;background:#101720d9;display:grid;place-content:center;color:#ffd18b}.empty[hidden]{display:none}footer,.caption{color:#b2c1d1;margin:8px 12px}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 10px}.legend i{display:inline-block;width:12px;height:12px;margin-right:5px}select,button{background:#293d50;border:1px solid #5a7694;border-radius:4px;color:white;padding:5px}#hover{min-height:21px}@media(max-width:750px){main{grid-template-columns:1fr}}
</style><script defer src="field-lite.js"></script></head><body>
<header><h1>当前帧三维距离场</h1><span class="badge">单帧 · 不累积融合 · 未接入导航</span><a href="/" target="_top">主调试页</a><span id="link">正在连接</span></header>
<p id="metrics">等待深度距离场</p><main>
<section class="card"><div class="heading"><b>体素表面</b><button id="reset">复位视角</button></div><div class="view"><canvas id="surface" width="700" height="420" aria-label="相机坐标系中的当前帧三维体素表面"></canvas><span class="empty" id="surfaceEmpty">等待当前帧</span></div><p class="caption">拖动旋转，滚轮缩放。显示观测表面体素，包含地面和人物。</p></section>
<section class="card"><div class="heading"><b>距离场切片</b><select id="slice" aria-label="切片高度"><option value="0">相机上方约 22.5 cm</option><option value="1" selected>接近相机高度</option><option value="2">相机下方约 17.5 cm</option></select></div><div class="view"><canvas id="sliceCanvas" width="700" height="420" aria-label="相机前方三米的观测区域距离场切片"></canvas><span class="empty" id="sliceEmpty">等待当前帧</span></div><p class="caption" id="hover">横轴：相机左右；纵轴：相机前方距离</p><div class="legend"><span><i style="background:#ff685e"></i>表面体素</span><span><i style="background:#edb54a"></i>接近表面</span><span><i style="background:#237fcb"></i>远离表面（≥1 m 截断）</span><span><i style="background:#0b1018;border:1px solid #6b7a8b"></i>未知</span></div></section>
</main><footer>范围：左右各 1.5 m、上下各 1 m、前方 3 m；体素 5 cm，更新目标 5 Hz。采用相机光学坐标，未按重力对齐。距离以体素中心计算，未知不等于自由空间；本页不是跨帧 TSDF 地图，也不是可直接用于运动的安全距离。</footer>
</body></html>
