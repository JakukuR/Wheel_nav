<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R680 · BICMap 控制台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><b>R680<span> / BICMap</span></b><small>机器人空间与感知</small></div><div id="connection" class="badge">连接中</div><div class="health"><span id="mapHealth">地图 —</span><span id="poseHealth">定位 —</span><span id="motionHealth">运动权限 —</span></div></header>
<main><section class="map-panel"><div class="toolbar"><div class="seg"><button id="view2d" class="active">2D 地图</button><button id="view3d">3D 点云</button></div><button id="fit">适配地图</button><button id="userMap">用户地图</button><span id="mapInfo">等待地图数据</span></div><div id="map"></div><div id="mapMessage">等待 ROS 地图或点云</div><div class="map-footer"><span id="position">map · 等待定位</span><span id="cloudInfo">点云 —</span><span id="cursor">x —　y —</span></div><div id="toast" role="status"></div></section>
<aside><section class="panel"><div class="section-title"><b>相机与识别</b><span id="cameraStatus">等待图像</span></div><div class="camera"><img id="camera" alt="D455 实时画面与同帧识别框"><div id="cameraEmpty">等待 D455 彩色图像</div></div><div id="detections" class="objects">暂无新鲜识别结果</div><small id="followStatus">物体跟随：等待状态</small></section>
<section class="panel"><div class="section-title"><b>导航任务</b><span id="goalStatus">等待状态</span></div><p class="muted" id="selection">点击“选择目标”，再在地图点击位置和朝向。</p><div class="buttons"><button id="goalMode">选择目标</button><button id="poseMode">重定位</button><button id="submit" class="primary" disabled>提交所选位姿</button><button id="cancel" class="danger" disabled>取消导航</button><button id="home" disabled>返回出生点</button><button id="clear" disabled>清理代价地图</button></div><small id="controlHint">等待控制接口</small></section>
<section class="panel"><div class="section-title"><b>图层与状态</b><span id="odom">速度 —</span></div><div class="layers"><label><input type="checkbox" id="cloudLayer" checked>点云</label><label><input type="checkbox" id="pathLayer" checked>路径</label><label><input type="checkbox" id="semanticLayer" checked>语义标记</label><label>点大小 <input type="range" id="pointSize" min="1" max="8" value="3"></label></div><details><summary>速度调试 · 最近 30 秒</summary><select id="velocityAxis"><option value="vx">线速度 m/s</option><option value="wz">角速度 rad/s</option></select><canvas id="velocity" height="100"></canvas><small>蓝：原始指令　橙：平滑指令</small></details></section></aside></main>
<footer><span>真实 ROS 数据 · 断流显示过期状态</span><a href="/vendor/THIRD-PARTY-LICENSES.md" target="_blank" rel="noopener">开源许可</a></footer><script src="/vendor/bicmap-0.0.9.min.js"></script><script type="module" src="/app.js"></script></body></html>
