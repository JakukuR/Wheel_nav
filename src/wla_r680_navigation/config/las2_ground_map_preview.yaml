# Costmap-only integration test. This is NOT a navigation bringup.
# Dedicated current-frame reference: no world accumulation or odometry assumed.
/**:
  ros__parameters:
    global_frame: stereo_local_ground_preview
    robot_base_frame: base_Link
    update_frequency: 5.0
    publish_frequency: 5.0
    transform_tolerance: 0.30
    rolling_window: false
    resolution: 0.05
    track_unknown_space: true
    always_send_full_costmap: true
    footprint: '[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]'
    footprint_padding: 0.01
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /r680/debug/stereo/ground_map/grid
      map_subscribe_transient_local: false
      first_map_only: false
      subscribe_to_updates: false
      footprint_clearing_enabled: false
      trinary_costmap: true
      lethal_cost_threshold: 100
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.40
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false
