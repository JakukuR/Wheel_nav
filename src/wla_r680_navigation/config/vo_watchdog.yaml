r680_vo_watchdog:
  ros__parameters:
    vo_topic: /r680_nav/vo_odom
    info_topic: /d455_slam/odom_info
    wheel_topic: /wheel/odom
    # 启动宽限；RGB-D 检查 OdomInfo，cuVSLAM 检查原始 VIO 与显式连续里程计。
    startup_grace_s: 12.0
    stale_s: 1.5
    lost_limit: 3
    # 诊断阈值高于当前 1.2 m/s 命令上限，避免将正常加速误判为跳变。
    jump_linear_mps: 2.5
    jump_angular_rps: 3.0
    wheel_window_s: 0.5
    # 轮式里程计尚未作为定位真值，只检测持续且显著的运动量分歧。
    wheel_translation_error_m: 0.45
    wheel_yaw_error_rad: 0.65
    wheel_mismatch_limit: 3
    # 角度正负号与时延需实测确认后再开放轮/VO 航向比较。
    compare_wheel_yaw: false
    # RGB-D故障可重启；cuVSLAM保持运行，故障只关闭导航并重新验证地图。
    restart_enabled: true
    # VO 新进程稳定、RTAB-Map 重新定位且地图位姿与轮里程计一致才解除锁定。
    localization_topic: /d455_slam/localization_pose
    recovery_stable_s: 2.0
    localization_stale_s: 3.0
    # Current map correction applied to base at localization source time.
    localization_odom_frame: d455_floor_odom
    localization_translation_error_m: 0.40
    localization_yaw_change_rad: 0.80
    # One initialpose after respawn and verified stationary/tracking feedback.
    # This hint never replaces real RTAB-Map match/pose/stability verification.
    relocalization_prior_enabled: true
    initial_pose_topic: /d455_slam/initialpose
    prior_max_translation_m: 0.50
    prior_max_yaw_rad: 0.80
    prior_stop_stable_s: 0.50
    prior_tracking_stable_s: 1.0
    prior_max_wait_s: 20.0
    # Recovery: 1 m spatial matching -> 3 m -> RTAB BoW VPR + RGB-D geometry.
    staged_relocalization_enabled: true
    # Startup: whole-map BoW+PnP search (spatial proximity off, stale database prior
    # ignored); one verified match admits the map. Until then the robot runs mapless
    # (navigation_map_mode) on live obstacle layers. true waits for two views that
    # imply the same map->odom; an operator initial pose admits within the radius below.
    startup_global_search: true
    startup_view_consistency: false
    manual_prior_radius_m: 1.0
    manual_prior_yaw_rad: 0.6
    rtabmap_node: /d455_slam/rtabmap
    recovery_near_radius_m: 1.0
    recovery_expanded_radius_m: 3.0
    recovery_near_timeout_s: 8.0
    recovery_expanded_timeout_s: 12.0
    recovery_vpr_timeout_s: 30.0
    # One geometrically verified RTAB-Map relocalization is sufficient.
