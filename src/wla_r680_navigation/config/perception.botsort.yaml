# Shared nav detector BoT-SORT configuration; validated with Ultralytics 8.3.203.
# Candidate tuning for 5 Hz perception, to be validated on R680 recordings.
tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 5
match_thresh: 0.8
fuse_score: true
# ORB retains camera-motion compensation with substantially lower CPU cost on
# the 15 W Orin than sparse optical flow.
gmc_method: orb
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
