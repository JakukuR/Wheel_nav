# Native BoxMOT 25 BoT-SORT; all person detections use OSNet appearance.
# This is not an Ultralytics model.track() configuration.
tracker_type: boxmot_botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 15
match_thresh: 0.8
proximity_thresh: 0.5
appearance_thresh: 0.25
use_cmc: true
cmc_method: sof
use_embeddings: true
