# MPC + local Scan + expiring global dynamic planning hints.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: r680_mapping_floor
    odom_topic: /d455_slam/odom
    bt_loop_duration: 10
    default_server_timeout: 20
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /d455_slam/odom
    controller_frequency: 20.0
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      trans_stopped_velocity: 0.025
      rot_stopped_velocity: 0.04
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.18
    FollowPath:
      plugin: wla_diff_mpc::DiffMpcController
      horizon: 20
      model_dt: 0.1
      vx_min: -0.08
      vx_max: 0.3
      wz_max: 0.5
      ax_max: 0.6
      az_max: 1.2
      q_x: 8.0
      q_y: 8.0
      q_yaw: 3.0
      q_terminal_x: 16.0
      q_terminal_y: 16.0
      q_terminal_yaw: 6.0
      r_v: 0.4
      r_w: 0.3
      r_delta_v: 0.8
      r_delta_w: 0.5
      solve_time_limit: 0.025
      cycle_time_limit: 0.045
      final_align_enter_distance: 0.2
      final_align_exit_distance: 0.28
      final_align_wz_max: 0.22
      # Terminal: confirm stopping, independent yaw braking, latch zero in tolerance.
      final_align_velocity_topic: /d455_slam/odom
      final_align_velocity_timeout_s: 0.20
      final_align_stopped_linear_velocity: 0.025
      final_align_stopped_angular_velocity: 0.04
      final_align_stop_stable_s: 0.35
      final_align_angular_deceleration: 0.40
      final_align_reaction_time: 0.70
      final_align_yaw_gain: 1.0
      turn_time_constant: 0.65
      obstacle_braking_deceleration: 0.4
      obstacle_reaction_time: 0.7
      obstacle_stop_margin: 0.1
      collision_retry_speed_scale: 0.5
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.1
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 200000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - drive_on_heading
    - wait
    local_frame: d455_floor_odom
    global_frame: map
    robot_base_frame: r680_mapping_floor
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.5
    backup:
      plugin: nav2_behaviors::BackUp
      minimum_speed: 0.02
      acceleration_limit: 0.4
      deceleration_limit: -0.8
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: d455_floor_odom
      robot_base_frame: r680_mapping_floor
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]'
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: d455_scan d455_clearing
        d455_scan:
          topic: /r680_nav/d455/scan
          data_type: LaserScan
          clearing: false
          marking: true
          min_obstacle_height: -0.08
          max_obstacle_height: 0.5
          obstacle_min_range: 0.15
          obstacle_max_range: 4.5
          expected_update_rate: 0.2
          observation_persistence: 0.5
        d455_clearing:
          topic: /r680_nav/d455/clearing_points
          data_type: PointCloud2
          clearing: true
          marking: false
          min_obstacle_height: -0.08
          max_obstacle_height: 0.5
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          expected_update_rate: 0.2
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.4
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: r680_mapping_floor
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]'
      footprint_padding: 0.0
      plugins:
      - static_layer
      - dynamic_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /r680/d455/map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
      dynamic_layer:
        plugin: wla_r680_navigation::TimedObstacleLayer
        topic: /r680_nav/d455/points
        persistence_s: 2.0
        confirmation_hits: 2
        max_observation_gap_s: 0.3
        source_timeout_s: 0.5
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.6
    - 0.0
    - 0.7
    min_velocity:
    - -0.1
    - 0.0
    - -0.7
    max_accel:
    - 0.5
    - 0.0
    - 0.5
    max_decel:
    - -1.2
    - 0.0
    - -2.5
    odom_topic: /wheel/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.02
    velocity_timeout: 0.3
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: r680_mapping_floor
    odom_frame_id: d455_floor_odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /r680_nav/cmd_vel_collision_checked
    state_topic: /r680_nav/collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      points: '[[0.24, 0.24], [0.24, -0.24], [-0.24, -0.24], [-0.24, 0.24]]'
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      enabled: true
    observation_sources:
    - d455_points
    d455_points:
      type: pointcloud
      topic: /r680_nav/d455/points_safety
      min_height: 0.04
      max_height: 0.5
      use_global_height: false
      enabled: true
