# Optional Nav2 controller_server overlay. This file does not switch the active
# R680 controller; copy the FollowPath block into a test parameter file first.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: wla_diff_mpc::DiffMpcController
      horizon: 20
      model_dt: 0.1
      vx_min: -0.08
      vx_max: 0.3
      wz_max: 0.5
      ax_max: 0.6
      az_max: 1.2
      q_x: 8.0
      q_y: 8.0
      q_yaw: 3.0
      q_terminal_x: 16.0
      q_terminal_y: 16.0
      q_terminal_yaw: 6.0
      r_v: 0.4
      r_w: 0.3
      r_delta_v: 0.8
      r_delta_w: 0.5
      solve_time_limit: 0.025
      cycle_time_limit: 0.045
      final_align_enter_distance: 0.20
      final_align_exit_distance: 0.28
      final_align_wz_max: 0.22
      turn_time_constant: 0.65
