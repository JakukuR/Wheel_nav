explore_node:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: r680_mapping_floor
    raw_occupancy: true
    costmap_topic: /r680/d455/map
    costmap_updates_topic: /r680/d455/map_updates
    visualize: true
    return_to_init: false
    planner_frequency: 0.5
    progress_timeout: 30.0
    potential_scale: 3.0
    gain_scale: 1.0
    min_frontier_size: 0.4
    transform_tolerance: 0.3
    scan_after_goal: true
    scan_timeout_s: 60.0
    guarded_recovery: true
    recovery_distance: 0.20
    recovery_speed: 0.08
    goal_merge_distance: 0.10
    failed_goal_radius: 0.40
    failed_goal_cooldown_s: 30.0
    failed_goal_attempts: 3
