    angular_speed: 0.20
    target_travel_m: 0.16
    max_travel_m: 0.25
    max_radius_m: 0.25
    max_yaw_rad: 0.35
    max_measured_linear: 0.12
    max_measured_angular: 0.35
    sensor_timeout_s: 0.35
    minimum_imu_rate: 100.0
    minimum_depth_valid_ratio: 0.35
    obstacle_forward_distance: 0.65
    obstacle_half_width: 0.40
    stopped_linear: 0.015
    stopped_angular: 0.04
    result_path: /tmp/r680_vio_init.json
