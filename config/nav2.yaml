bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: r680_mapping_floor
    odom_topic: /d455_slam/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.18
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 800
      iteration_count: 1
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 0.30
      vx_min: -0.08
      vy_max: 0.0
      wz_max: 0.50
      ax_max: 0.60
      ax_min: -0.80
      az_max: 1.20
      prune_distance: 1.2
      transform_tolerance: 0.20
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.3
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 2
        threshold_to_consider: 0.5
        offset_from_furthest: 4
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      cost_travel_multiplier: 2.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    local_frame: d455_floor_odom
    global_frame: map
    robot_base_frame: r680_mapping_floor
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.20
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
      minimum_speed: 0.02
      acceleration_limit: 0.4
      deceleration_limit: -0.8
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: d455_floor_odom
      robot_base_frame: r680_mapping_floor
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.30, 0.24], [0.30, -0.24], [-0.25, -0.24], [-0.25, 0.24]]'
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: d455_points
        d455_points:
          topic: /r680_nav/d455/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.04
          max_obstacle_height: 0.50
          obstacle_min_range: 0.15
          obstacle_max_range: 4.5
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          expected_update_rate: 0.20
          observation_persistence: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: r680_mapping_floor
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.30, 0.24], [0.30, -0.24], [-0.25, -0.24], [-0.25, 0.24]]'
      footprint_padding: 0.02
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /r680/d455/map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 40.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.50]
    min_velocity: [-0.08, 0.0, -0.50]
    max_accel: [0.80, 0.0, 1.80]
    max_decel: [-1.20, 0.0, -2.50]
    odom_topic: /d455_slam/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.30

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: r680_mapping_floor
    odom_frame_id: d455_floor_odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /r680_nav/cmd_vel_collision_checked
    state_topic: /r680_nav/collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      points: "[[0.32, 0.26], [0.32, -0.26], [-0.27, -0.26], [-0.27, 0.26]]"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      enabled: true
    observation_sources: [d455_points]
    d455_points:
      type: pointcloud
      topic: /r680_nav/d455/points
      min_height: 0.04
      max_height: 0.50
      use_global_height: false
      enabled: true
