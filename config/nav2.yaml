bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: r680_mapping_floor
    odom_topic: /d455_slam/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /d455_slam/odom
    # MPPI requires the controller period to be no greater than model_dt=0.05 s.
    controller_frequency: 20.0
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.18
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Dog-slam MPPI horizon and sample budget; R680 stays differential drive.
      time_steps: 38
      model_dt: 0.05
      batch_size: 300
      iteration_count: 1
      vx_std: 0.50
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.60
      vx_min: -0.10
      vy_max: 0.0
      wz_max: 0.70
      ax_max: 0.65
      ax_min: -0.65
      az_max: 1.50
      prune_distance: 1.5
      max_robot_pose_search_dist: 1.5
      retry_attempt_limit: 1
      # Keep the measured D455/TF tolerance; the source's 0.01 s is too tight here.
      transform_tolerance: 0.20
      temperature: 0.1
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      critics: [ConstraintCritic, ObstaclesCritic, PathFollowCritic,
                GoalCritic, GoalAngleCritic, VelocityDeadbandCritic,
                PathAngleCritic, PathAlignCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
      ObstaclesCritic:
        enabled: true
        cost_power: 4
        consider_footprint: true
        critical_weight: 100.0
        repulsion_weight: 20.0
        collision_cost: 250.0
        # Scale the source's margin for R680's 0.40 m square footprint.
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 0.40
        cost_scaling_factor: 4.0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 40.0
        offset_from_furthest: 4
        threshold_to_consider: 0.75
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        use_path_orientations: true
        trajectory_point_step: 4
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 4
        threshold_to_consider: 0.75
        max_angle_to_furthest: 1.0
        # Jazzy mode 0 is the source config's forward preference.
        mode: 0
      GoalCritic:
        enabled: true
        cost_power: 6
        cost_weight: 50.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 6
        cost_weight: 50.0
        threshold_to_consider: 0.75
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 2
        cost_weight: 50.0
        deadband_velocities: [0.05, 0.0, 0.05]

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 200000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, drive_on_heading, wait]
    local_frame: d455_floor_odom
    global_frame: map
    robot_base_frame: r680_mapping_floor
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.50
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.50
    backup:
      plugin: nav2_behaviors::BackUp
      minimum_speed: 0.02
      acceleration_limit: 0.4
      deceleration_limit: -0.8
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: d455_floor_odom
      robot_base_frame: r680_mapping_floor
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]'
      footprint_padding: 0.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: d455_obstacles d455_clearing
        d455_obstacles:
          topic: /r680_nav/d455/points
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: -0.08
          max_obstacle_height: 0.50
          obstacle_min_range: 0.15
          obstacle_max_range: 4.5
          expected_update_rate: 0.20
          observation_persistence: 0.5
        d455_clearing:
          topic: /r680_nav/d455/clearing_points
          data_type: PointCloud2
          clearing: true
          marking: false
          min_obstacle_height: -0.08
          max_obstacle_height: 0.50
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          expected_update_rate: 0.20
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: r680_mapping_floor
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]'
      footprint_padding: 0.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /r680/d455/map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        # The local costmap reacts to raw points immediately. The global map
        # only accepts multi-frame confirmed voxels, but retains them when the
        # forward camera turns away.
        observation_sources: d455_confirmed d455_clearing
        d455_confirmed:
          topic: /r680_nav/d455/points_confirmed
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: -0.08
          max_obstacle_height: 0.50
          obstacle_min_range: 0.15
          obstacle_max_range: 4.5
          expected_update_rate: 0.30
          observation_persistence: 0.3
        d455_clearing:
          topic: /r680_nav/d455/clearing_points
          data_type: PointCloud2
          clearing: true
          marking: false
          min_obstacle_height: -0.08
          max_obstacle_height: 0.50
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          expected_update_rate: 0.20
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # Wheel feedback has about 0.7 s command/response lag. Feeding it back here
    # repeatedly restarts the acceleration limiter and creates stop-go motion.
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.0, 0.70]
    min_velocity: [-0.10, 0.0, -0.70]
    max_accel: [1.00, 0.0, 2.50]
    max_decel: [-1.20, 0.0, -2.50]
    odom_topic: /wheel/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.30

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: r680_mapping_floor
    odom_frame_id: d455_floor_odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /r680_nav/cmd_vel_collision_checked
    state_topic: /r680_nav/collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      points: "[[0.24, 0.24], [0.24, -0.24], [-0.24, -0.24], [-0.24, 0.24]]"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      enabled: true
    observation_sources: [d455_points]
    d455_points:
      type: pointcloud
      topic: /r680_nav/d455/points
      min_height: 0.04
      max_height: 0.50
      use_global_height: false
      enabled: true
