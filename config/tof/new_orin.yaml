tof_serial:
  ros__parameters:
    # ESP32-S3 board via FT232R (not the ESP32 USB-JTAG port). Opened without touching DTR/RTS.
    device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
    preview_fov_deg: 45.0
    min_distance_m: 0.15
    max_distance_m: 4.0
    stale_after_s: 0.30
    base_frame: base_Link
    # sensor_id 0..3 = board port 1..4 (LPn GPIO10..13). User confirmed 2026-11-13:
    # port1 front-right, port2 front-left, port3 back-right, port4 back-left.
    sensor_mounts: [front_right, front_left, rear_right, rear_left]
    mapping_source: user_confirmed_20261113
    # CAD mounts from config/uvc_rig/cad_20261112/sensor_mounts.cad.json (parent base_link).
    # Not optical calibration: boresight assumed along the mount link +x; zone grid orientation unverified.
    geometry_source: cad_20261112_boresight_x_assumed
    mount_front_left_xyz: [0.073442, 0.040495, 0.035893]
    mount_front_left_rpy: [0.0, 0.40776, 0.57931]
    mount_front_right_xyz: [0.073442, -0.040488, 0.035893]
    mount_front_right_rpy: [-1.0468e-05, 0.40778, -0.57934]
    mount_rear_left_xyz: [-0.0862125, 0.0203125, 0.026244885]
    mount_rear_left_rpy: [0.0, 0.785398163397441, 2.35619449019235]
    mount_rear_right_xyz: [-0.086212, -0.020313, 0.026245]
    mount_rear_right_rpy: [0.0, 0.7854, -2.3562]

tof_obstacles:
  ros__parameters:
    geometry_file: /home/onana/ros2_ws/config/tof/robot_geometry.json
    # User confirmed both wheels contact one plane, 2026-11-13. Reconfigure if lifted.
    support_mode: both
    obstacle_min_height_m: 0.05
    obstacle_max_height_m: 0.50
    max_input_age_s: 0.20
    max_input_skew_s: 0.10
    max_wheel_height_difference_m: 0.05
