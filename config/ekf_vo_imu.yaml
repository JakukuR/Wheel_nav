/d455_slam/ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: false
    publish_tf: true
    publish_acceleration: true
    map_frame: map
    odom_frame: d455_floor_odom
    base_link_frame: r680_mapping_floor
    world_frame: d455_floor_odom

    # RGB-D VO supplies the full six-degree pose and velocity. Its TF output is
    # disabled; this EKF is the sole owner of d455_floor_odom -> r680_mapping_floor.
    odom0: /r680_nav/vo_odom
    odom0_config: [true, true, true,
                   true, true, true,
                   true, true, true,
                   true, true, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    # Conditioned IMU uses Madgwick orientation plus all angular velocity and
    # acceleration axes. VO remains the absolute correction during long degradation.
    imu0: /r680_nav/d455/imu_filtered
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  true, true, true]
    imu0_differential: false
    imu0_relative: true
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    print_diagnostics: true
    dynamic_process_noise_covariance: true
